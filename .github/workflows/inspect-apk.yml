name: Inspect APK compatibility
on:
  push:
    paths:
      - '.github/workflows/inspect-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read APK architecture and Android manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/maxevrik/x431-apk-check/releases/assets/695944308 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/app.apk"
          python3 - "$RUNNER_TEMP/app.apk" <<'PY'
          import sys, zipfile, struct, hashlib, collections
          p = sys.argv[1]
          with open(p, 'rb') as f:
              print('SHA256:', hashlib.file_digest(f, 'sha256').hexdigest())
          z = zipfile.ZipFile(p)
          names = z.namelist()
          libs = [n for n in names if n.startswith('lib/') and n.endswith('.so')]
          print('Native ABI counts:', dict(collections.Counter(n.split('/')[1] for n in libs)))
          print('Embedded native files:', len([n for n in names if n.endswith('.so')]))
          for n in libs:
              h = z.read(n)[:64]
              print('LIB', n, 'ELF bits:', {1:32,2:64}.get(h[4]) if h[:4] == b'\x7fELF' else 'not ELF')
          d = z.read('AndroidManifest.xml')
          u16 = lambda o: struct.unpack_from('<H', d, o)[0]
          u32 = lambda o: struct.unpack_from('<I', d, o)[0]
          strings = []
          def getstr(i):
              return strings[i] if 0 <= i < len(strings) else None
          def length8(o):
              a = d[o]
              return (((a & 127) << 8) | d[o+1], o+2) if a & 128 else (a, o+1)
          def length16(o):
              a = u16(o)
              return (((a & 32767) << 16) | u16(o+2), o+4) if a & 32768 else (a, o+2)
          off = u16(2)
          while off + 8 <= len(d):
              typ, head, size = struct.unpack_from('<HHI', d, off)
              if size < 8 or off + size > len(d):
                  raise ValueError('Invalid manifest chunk')
              if typ == 1:
                  count, flags, start = u32(off+8), u32(off+16), u32(off+20)
                  for i in range(count):
                      o = off + start + u32(off + head + 4*i)
                      if flags & 256:
                          _, o = length8(o)
                          length, o = length8(o)
                          strings.append(d[o:o+length].decode('utf-8', 'replace'))
                      else:
                          length, o = length16(o)
                          strings.append(d[o:o+2*length].decode('utf-16le', 'replace'))
              elif typ == 258:
                  tag = getstr(u32(off+20))
                  attrs = {}
                  attrstart, attrsize, count = u16(off+24), u16(off+26), u16(off+28)
                  for i in range(count):
                      a = off + 16 + attrstart + i*attrsize
                      key, raw, kind, val = getstr(u32(a+4)), u32(a+8), d[a+15], u32(a+16)
                      value = getstr(raw) if raw != 0xffffffff else getstr(val) if kind == 3 else bool(val) if kind == 18 else val
                      attrs[key] = value
                  if tag in ('manifest','uses-sdk','uses-feature','uses-library','uses-native-library'):
                      print('MANIFEST', tag, attrs)
                  elif tag == 'application':
                      print('MANIFEST application', {k:v for k,v in attrs.items() if k in ('extractNativeLibs','multiArch','use32bitAbi','hasCode','debuggable','name')})
              off += size
          print('Other embedded libraries:', [n for n in names if n.endswith('.so') and not n.startswith('lib/')][:100])
          print('Archive CRC check:', z.testzip())
          PY
